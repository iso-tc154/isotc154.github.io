schedule:
  - date: 2026-08-31
    time: "9:00–10:30"
    event: Plenary opening session
    description: >
      Agenda items 1-11: opening, welcome from host, roll call, Code of
      Ethics, adoption of agenda, resolution drafting committee, minutes,
      management report (CM report incl. ballot results), resolutions and
      action items review, ISO Excellence Awards, PWI proposals, and the
      Rising Standards Powers research presentation. Hybrid — Zoom
      meeting ID 850 446 6562 (password TC154).
  - date: 2026-08-31
    time: "11:00–12:30"
    event: JWG 1
    description: Discussion of ISO/AWI TR 25579, etc.
  - date: 2026-08-31
    time: "14:00–15:30"
    event: WG 2
    description: Discussion of ISO/DIS 17369, possible proposal, etc.
  - date: 2026-08-31
    time: "16:00–17:30"
    event: SG 1
    description: Discussion of ISO/PWI 36100, ISO/PWI 36200.
  - date: 2026-09-01
    time: "9:00–12:00"
    event: JWG 9
    description: Discussion of ISO/AWI 7372 (UNTDED), ISO/AWI 20197-2, ISO/PWI 16356, etc.
  - date: 2026-09-01
    time: "14:00–17:00"
    event: WG 6
    description: Discussion of ISO/DIS 19626-3, ISO/AWI 14533-5, etc.
  - date: 2026-09-02
    time: "9:00–17:00"
    event: WG 7
    description: >
      Other parts of ISO 5054, other parts of ISO 15000, ISO/DIS 22132,
      ISO/TR 20180, ISO/CD TR 20194, ISO/PWI 20195, etc. WG 7 has also
      scheduled a virtual session from 14:00 (UTC+2) on the ISO meeting
      platform.
  - date: 2026-09-02
    time: "18:30–20:30"
    event: Social — Zoo Berlin evening tour
    description: >
      Exclusive evening tour of Zoo Berlin (5-10 min walk from DIN, just
      across the street). Meet 18:30 at DIN; tour starts 19:00. Register
      via the ISO meeting platform.
  - date: 2026-09-02
    time: "20:30–late"
    event: Social — Biergarten at Café am Neuen See
    description: >
      Informal visit to the nearby Biergarten Café am Neuen See after the
      Zoo tour. Self-service, own expenses.
  - date: 2026-09-03
    time: "9:00–12:00"
    event: TC-level Projects meeting
    description: >
      Discussion of ISO/PWI 26087, ISO/PWI TR XXXX, etc. The first
      ISO/NP 26087 ballot failed; a coordination meeting with TC 207 and
      ISO/CS was held on 15 July. TC 154 awaits technical feedback from
      TC 207/SC 7 and TC 322 and strategic coordination comments from
      ISO/CS before launching the 2nd NP ballot. Hybrid — Zoom meeting
      ID 850 446 6562 (password TC154).
  - date: 2026-09-03
    time: "14:00–17:00"
    event: WG 5
    description: Discussion of ISO/CD 8601-1, ISO/CD 8601-2, ISO/AWI 34000, etc.
  - date: 2026-09-04
    time: "9:00–12:00"
    event: (J)WGs report to Plenary
    description: >
      Agenda items 12-15: ISO/IEC Directives update, (J)WG reports
      (JWG1, WG2, SG1, WG5, WG6, WG7, JWG9), TC-level project report,
      reappointment of convenors. Zoom applies to the whole day.
  - date: 2026-09-04
    time: "14:30–17:30"
    event: Plenary closing session
    description: >
      Agenda items 16-23: liaison reports, strategic issues / Business
      Plan, communication, national body report, next plenary dates,
      any other business, approval of resolutions, closure. Zoom meeting
      ID 850 446 6562 (password TC154).

